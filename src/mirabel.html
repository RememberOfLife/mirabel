<!doctype html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>mirabel-web</title>
        <style>
            body {
                font-family: sans-serif;
                margin: 0;
                padding: none;
                height: 100vh;
                overflow: hidden;
            }

            #container {
                display: flex;
                height: 100%;
            }

            #container.top-line-split {
                flex-direction: column;
            }

            #log-topline {
                display: none;
            }
            #log-panel {
                display: none;
                flex-direction: column;
                height: 100%;
            }
            #run {
                width: 100%;
            }

            .top-line-split #log-topline {
                display: block;
            }
            .top-line-split #run {
                width: 100%;
            }

            .vertical-split #log-panel {
                display: flex;
                width: 25%;
            }
            .vertical-split #run {
                width: 75%;
            }

            #log-scroll-box {
                overflow-y: auto;
                height: 100%;
            }

            .horizontal-button-array {
                display: flex;
            }

            .flat-btn {
                text-align: center;
                border: none;
                cursor: pointer;
                font-weight: bold;
                margin: 0;
                display: block;
            }

            .btn-fill {
                flex-grow: 1;
                width: 100%;
            }

            .btn-minspace {
                flex-shrink: 0;
            }

            .btn-red {
                background-color: lightpink;
            }
            .btn-red:hover {
                background-color: lightcoral;
            }
            .btn-red:active {
                background-color: indianred;
            }

            .btn-blue {
                background-color: lightskyblue;
            }
            .btn-blue:hover {
                background-color: cornflowerblue;
            }
            .btn-blue:active {
                background-color: steelblue;
            }

            /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
            #canvas {
                /* position: absolute; */
                /* top: 0px;
                left: 0px; */
                margin: 0px;
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: block;

                image-rendering: optimizeSpeed;
                image-rendering: crisp-edges;
                image-rendering: pixelated;

                border: 0px none;
                background-color: black;
            }

            #log {
                margin: 1em;
                line-height: 1.5em;
                border-top: 1px dashed lightgray;
                font-family: monospace;
            }

            #log .log-line {
                display: flex;
                align-items: flex-start;
                border-bottom: 1px dashed lightgray;
                color: black;
            }
            
            #log .log-line.log-bold {
                font-weight: bold;
            }

            #log .log-line .log-status {
                flex: 0 0 4em;
                display: flex;
                display: inline-block;
                width: 4em;
                text-align: right;
                margin-right: 0.5em;
            }

            #log .log-line .log-message {
                flex: 1;
            }

            #log .log-line .log-lesser {
                color: gray;
            }
            #log .log-line .log-ok {
                color: forestgreen;
            }
            #log .log-line .log-info {
                color: royalblue;
            }
            #log .log-line .log-warning {
                color: orangered;
            }
            #log .log-line .log-error {
                color: crimson;
            }
            #log .log-line.log-fatal {
                color: crimson;
                border-bottom: 2px dotted crimson;
            }
            
            /* #log .log.line.log-highlight {
                
            } */

        </style>
    </head>
    <body>

        <!-- TODO make it so the first logline is always visible at the very top, and with a button it can be expanded and the canvas gets hidden or smaller? -->

        <div id="container" class="">

            <div id="log-topline">
                
                <div class="horizontal-button-array">

                    <button class="flat-btn btn-blue btn-fill" onclick="switch_log_split_mode('vertical-split')">OPEN LOG</button>

                    <button class="flat-btn btn-red btn-minspace" onclick="switch_log_split_mode('')">CLOSE</button>

                </div>

            </div>

            <div id="log-panel">

                <div class="horizontal-button-array">

                    <button class="flat-btn btn-blue btn-fill" onclick="switch_log_split_mode('top-line-split')">HIDE</button>

                    <button class="flat-btn btn-red btn-minspace" onclick="switch_log_split_mode('')">CLOSE</button>

                </div>

                <div id="log-scroll-box">

                    <div id="log">
                        <!-- TODO placeholder element to mark empty log ? -->
                    </div>
    
                </div>

            </div>
    
            <div id="run">
                <!-- Module.requestFullscreen(bool lock_hide_mouse_pointer, bool resize) -->
                <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
                <!-- TODO visual downloading + compile indicator progress bar, AND placeholder for the canvas while the wasm is not yet started, then the wasm should signal to switch out the downloader for the real thing once its ready! -->
            </div>

        </div>

        <template id="template_log-line">
            <div class="log-line">
                <!-- <div class="time"></div> -->
                <!-- <div class="origin"></div> -->
                <div class="log-status"></div>
                <div class="log-message"></div>
            </div>
        </template>

        <script>
            function switch_log_split_mode(mode) {
                let container = document.querySelector("#container");
                container.className = "";
                if (mode !== "") {
                    container.classList.add(mode);
                }
            }
        </script>

        <script type="text/javascript">
            const LOGS = {
                LESS: "LESS",
                NORM: "NORM",
                OK: "OK",
                INFO: "INFO",
                WARN: "WARN",
                ERR: "ERR",
                FATAL: "FATAL",
            };
            function log(status, text, bold = null, line_colored = null, highlight = null) {
                if (bold === null) {
                    bold = (status === LOGS.FATAL);
                }
                if (line_colored === null) {
                    line_colored = (status === LOGS.FATAL);
                }
                if (highlight === null) {
                    highlight = (status === LOGS.FATAL); //TODO implement this, inverts the line, e.g. fatal has red background and white text
                }
                let new_template = document.querySelector("#template_log-line").content.cloneNode(true);
                let new_log_line = new_template.querySelector(".log-line");
                let new_status = new_template.querySelector(".log-status");
                let new_message = new_template.querySelector(".log-message");
                new_message.textContent = text;
                if (!LOGS.hasOwnProperty(status)) {
                    status = LOGS.WARN;
                    new_message.innerHTML = "&lt;unknown log status&gt;<br>" + new_message.innerHTML;
                }
                switch (status) {
                    case LOGS.LESS: {
                        new_message.className += " log-lesser";
                        new_status.textContent = "";
                        console.log(text)
                    } break;
                    case LOGS.NORM: {
                        new_status.textContent = ">";
                        console.log(text)
                    } break;
                    case LOGS.OK: {
                        new_status.className += " log-ok";
                        new_status.textContent = "OK";
                        if (line_colored) {
                            new_message.className += " log-ok";
                        }
                        console.log(text)
                    } break;
                    case LOGS.INFO: {
                        new_status.className += " log-info";
                        new_status.textContent = "INFO";
                        if (line_colored) {
                            new_message.className += " log-info";
                        }
                        console.info(text)
                    } break;
                    case LOGS.WARN: {
                        new_status.className += " log-warning";
                        new_status.textContent = "WARN";
                        if (line_colored) {
                            new_message.className += " log-warning";
                        }
                        console.warn(text)
                    } break;
                    case LOGS.ERR: {
                        new_status.className += " log-error";
                        new_status.textContent = "ERROR";
                        if (line_colored) {
                            new_message.className += " log-error";
                        }
                        console.error(text)
                    } break;
                    case LOGS.FATAL: {
                        bold = true;
                        line_colored = true;
                        new_log_line.className += " log-fatal";
                        new_status.textContent = "FATAL";
                        if (line_colored) {
                            new_message.className += " log-fatal";
                        }
                        console.error("FATAL: " + text)
                    } break;
                }
                if (bold === true) {
                    new_log_line.className += " log-bold";
                }
                // TODO status brackets here or style them in css as centered
                document.querySelector("#log").appendChild(new_template);
            }
        </script>

        <script type="text/javascript">
            function meta_arg(key, val) {
                function assert_no_val() {
                    if (val !== "") {
                        log(LOGS.WARN, "web wrap: arg \"" + key + "\" does not take a value");
                    }
                }
                switch (key) {
                    case "logh": { 
                        assert_no_val();
                        switch_log_split_mode("top-line-split");
                    } break;
                    case "log": { 
                        assert_no_val();
                        switch_log_split_mode("vertical-split");
                    } break;
                    default: {
                        log(LOGS.WARN, "web wrap: ignoring unknown arg \"" + key + "\"");
                    } break;
                }
            }
            function query_params_to_cli_args() {
                const escape_char = "*"
                const args = ["web-hostname=" + location.hostname];
                const url_params = new URLSearchParams(window.location.search);
                for (const [ckey, cval] of url_params) {
                    let key = ckey.trim();
                    let val = cval.trim();
                    if (key.startsWith(escape_char)) {
                        key = key.substr(1);
                        if (!key.startsWith(escape_char)) {
                            meta_arg(key, val);
                            continue;
                        }
                    }
                    if (val === "") {
                        args.push(key);
                    } else {
                        args.push(key.concat("=", val));
                    }
                };
                return args;
            }
            const cli_args = query_params_to_cli_args();
        </script>
        <script type="text/javascript">
            var Module = {
                arguments: cli_args,
                print: (function() {
                    return (...args) => {
                        var text = args.join(" ");
                        // These replacements are necessary if you render to raw HTML
                        //text = text.replace(/&/g, "&amp;");
                        //text = text.replace(/</g, "&lt;");
                        //text = text.replace(/>/g, "&gt;");
                        //text = text.replace("\n", "<br>", "g");
                        log(LOGS.NORM, text);
                        // element.scrollTop = element.scrollHeight; // focus on bottom
                    };
                })(),
                printErr: (function() {
                    return (...args) => {
                        var text = args.join(" ");
                        // These replacements are necessary if you render to raw HTML
                        //text = text.replace(/&/g, "&amp;");
                        //text = text.replace(/</g, "&lt;");
                        //text = text.replace(/>/g, "&gt;");
                        //text = text.replace("\n", "<br>", "g");
                        log(LOGS.WARN, text);
                        // element.scrollTop = element.scrollHeight; // focus on bottom
                    };
                })(),
                canvas: (() => {
                    var canvas = document.getElementById("canvas");
                    // As a default initial behavior, pop up an alert when webgl context is lost. To make your
                    // application robust, you may want to override this behavior before shipping!
                    // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
                    canvas.addEventListener("webglcontextlost", (e) => {
                        alert("WebGL context lost. You will need to reload the page.");
                        e.preventDefault();
                    }, false);
                    return canvas;
                })(),
                setStatus: (text) => {
                    if (!Module.setStatus.last) Module.setStatus.last = {
                        time: Date.now(),
                        text: ""
                    };
                    if (text === Module.setStatus.last.text) return;
                    var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                    var now = Date.now();
                    if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
                    Module.setStatus.last.time = now;
                    Module.setStatus.last.text = text;
                    log(LOGS.LESS, "Module.setStatus: " + text);
                },
                totalDependencies: 0,
                monitorRunDependencies: (left) => {
                    this.totalDependencies = Math.max(this.totalDependencies, left);
                    Module.setStatus(left ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "All downloads complete.");
                }
            };
            Module.setStatus("Downloading...");
            window.onerror = (event) => {
                // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
                Module.setStatus("Exception thrown, see JavaScript console");
                Module.setStatus = (text) => {
                    if (text) log(LOGS.ERR, "[post-exception status] " + text);
                };
            };
        </script>
        {{{ SCRIPT }}}
    </body>
</html>
